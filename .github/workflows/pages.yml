# Publishes io-threads.com only when the site checks, the secret scan and the browser smoke test pass.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
name: Check and publish site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner
      - run: python .ci/check.py
      - run: python .ci/links.py
      # The browser download is cached between runs (it counts against Actions minutes once the repo is private).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: ~/.cache/ms-playwright, key: playwright-1.48.0-chromium }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python .ci/smoke.py
      - name: Bundle what Pages serves (no CI, tooling or repo files)
        run: rsync -a --exclude .git --exclude .github --exclude .ci --exclude .netlify --exclude README.md --exclude LICENSE --exclude .gitleaks.toml ./ _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: _site }
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
